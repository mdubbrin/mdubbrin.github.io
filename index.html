<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew Dubbrin</title>
<meta name="description" content="Security research and IT security coursework by Matthew Dubbrin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Source+Serif+4:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f6f7f6; --ink:#171b1a; --ink-soft:#4c5957; --rule:#d8e0de; --accent:#0b6e75;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#12191a; --ink:#e7ece9; --ink-soft:#aebdb8; --rule:#2a3736; --accent:#5cc6cc; }
  }
  *{box-sizing:border-box;}
  body{
    background:var(--paper); color:var(--ink); margin:0;
    font-family:"Source Serif 4", Georgia, serif;
    min-height:100vh; display:flex; flex-direction:column;
  }
  main{ max-width:640px; margin:0 auto; padding:64px 20px 40px; flex:1; }
  h1{ font-family:"Fraunces", serif; font-weight:600; font-size:clamp(28px,6vw,40px); margin:0 0 6px; }
  p.tagline{ color:var(--ink-soft); font-size:17px; margin:0 0 36px; }
  nav{ display:flex; flex-wrap:wrap; gap:10px 18px; margin-bottom:40px; }
  nav a{
    font-family:"IBM Plex Mono", monospace; font-size:13px; letter-spacing:.03em;
    color:var(--ink); text-decoration:none; border-bottom:1.5px solid var(--rule); padding-bottom:2px;
  }
  nav a:hover{ border-bottom-color:var(--accent); color:var(--accent); }
  section h2{ font-family:"Fraunces", serif; font-size:19px; font-weight:600; margin:0 0 10px; }
  section p{ color:var(--ink-soft); font-size:15px; max-width:60ch; }
  footer{
    font-family:"IBM Plex Mono", monospace; font-size:11.5px; color:var(--ink-soft);
    border-top:1px solid var(--rule); padding:18px 20px; text-align:center;
  }
</style>
</head>
<body>
<main>
  <h1>Matthew Dubbrin</h1>
  <p class="tagline">IT security student &amp; researcher — University of Central Florida</p>

  <nav>
    <a href="research/">Research</a>
    <a href="https://github.com/mdubbrin" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <section>
    <h2>About</h2>
    <p>
      This site is under construction — content is migrating over from an
      older portfolio. Start with the Research section for published
      vulnerability write-ups.
    </p>
  </section>
</main>
<footer>mdubbrin.github.io</footer>
</body>
</html>
